version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sportsai_postgres
    restart: always
    environment:
      POSTGRES_USER: sportsai
      POSTGRES_PASSWORD: sportsaipassword
      POSTGRES_DB: sportsai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
